<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>เวรกรรม.. — ระบบบันทึกคะแนนสำหรับครู</title>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
<link rel="shortcut icon" href="assets/icons/favicon.ico">

<!-- Add to Home Screen (iOS) -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เวรกรรม..">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Add to Home Screen (Android/Chrome) + PWA manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F4F4">

<!-- ฟอนต์: รวมเป็นคำขอเดียว ไม่ใช้ @import (ไม่บล็อกการแสดงผลต่อเนื่อง) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">

<script src="js/theme.js"></script>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <img class="mark-lg" src="assets/icons/logo-128.webp" alt="โลโก้">
    <h1>เวรกรรม..</h1>
    <p>ระบบบันทึกคะแนนสำหรับครู เข้าสู่ระบบด้วยบัญชี Google เพื่อเริ่มใช้งาน</p>
    <button class="google-btn" id="google-signin-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 013.68 9c0-.59.1-1.17.28-1.71V4.95H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.05l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
      เข้าสู่ระบบด้วย Google
    </button>
    <p class="login-note">ข้อมูลนักเรียนที่บันทึกเป็นข้อมูลส่วนบุคคล เก็บบน Google Firebase ผูกกับบัญชีของครูเท่านั้น ส่งออกหรือลบข้อมูลได้ที่ ตั้งค่า &gt; ความเป็นส่วนตัว</p>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" class="hidden">
  <button class="hamburger-btn" id="hamburger-btn" aria-label="เปิดเมนู">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- แถบเมนูล่าง (มือถือ) — สร้างจากเมนูข้างโดย js/app.js -->
  <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก"></nav>
  <div class="more-scrim" id="more-scrim"></div>
  <div class="more-sheet" id="more-sheet" role="dialog" aria-label="เมนูเพิ่มเติม">
    <div class="more-grip"></div>
    <div class="more-grid" id="more-grid"></div>
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button type="button" class="brand" id="sidebar-toggle" title="ย่อ/ขยายเมนู" aria-label="ย่อ/ขยายเมนู"><img class="mark" src="assets/icons/logo-128.webp" alt="โลโก้"><span class="brand-text">เวรกรรม..</span></button>
    </div>

    <nav class="nav-list">
      <button class="nav-item active" data-route="dashboard" data-tip="หน้าหลัก">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><path d="M12 2.9a1.5 1.5 0 0 1 1 .4l7.6 6.5c.5.4.8 1 .8 1.7V19a2.2 2.2 0 0 1-2.2 2.2h-3.4a1 1 0 0 1-1-1v-4.3a1.6 1.6 0 0 0-1.6-1.6h-.4a1.6 1.6 0 0 0-1.6 1.6v4.3a1 1 0 0 1-1 1H4.8A2.2 2.2 0 0 1 2.6 19v-7.5c0-.7.3-1.3.8-1.7L11 3.3a1.5 1.5 0 0 1 1-.4Z"/></g></svg></span>
        <span class="nav-label">หน้าหลัก</span>
      </button>

      <div class="nav-divider"></div>

      <button class="nav-item" data-route="courses" data-tip="รายวิชาของฉัน">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><path d="M11 6.2C9.4 5 7.4 4.4 5.2 4.4c-.9 0-1.7.7-1.7 1.6v11.3c0 .9.8 1.6 1.7 1.6 2 0 3.9.5 5.8 1.7Z"/><path opacity=".55" d="M13 6.2c1.6-1.2 3.6-1.8 5.8-1.8.9 0 1.7.7 1.7 1.6v11.3c0 .9-.8 1.6-1.7 1.6-2 0-3.9.5-5.8 1.7Z"/></g></svg></span>
        <span class="nav-label">รายวิชาของฉัน</span>
      </button>
      <button class="nav-item" data-route="scores-page" data-tip="บันทึกคะแนน">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><path d="M16.2 3.6a2.4 2.4 0 0 1 3.4 0l.8.8a2.4 2.4 0 0 1 0 3.4L9.5 18.7a2 2 0 0 1-.9.5l-4.3 1.1a.8.8 0 0 1-1-1l1.1-4.3c.1-.3.3-.6.5-.9Z"/><rect opacity=".55" x="12" y="19.6" width="9" height="2" rx="1"/></g></svg></span>
        <span class="nav-label">บันทึกคะแนน</span>
      </button>
      <button class="nav-item" data-route="report-page" data-tip="รายงาน">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><path opacity=".55" d="M7 2.5h7l5.5 5.5v11A2.5 2.5 0 0 1 17 21.5H7A2.5 2.5 0 0 1 4.5 19V5A2.5 2.5 0 0 1 7 2.5Z"/><rect x="8" y="12.5" width="2" height="5" rx="1"/><rect x="11" y="10" width="2" height="7.5" rx="1"/><rect x="14" y="13.5" width="2" height="4" rx="1"/></g></svg></span>
        <span class="nav-label">รายงาน</span>
      </button>

      <div class="nav-divider"></div>

      <button class="nav-item" data-route="pa-page" data-tip="Personal Agreement">
        <span class="nav-icon" style="--w:var(--hue-violet)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><path opacity=".55" d="M7 2.5h7l5.5 5.5v11A2.5 2.5 0 0 1 17 21.5H7A2.5 2.5 0 0 1 4.5 19V5A2.5 2.5 0 0 1 7 2.5Z"/><rect x="8" y="9" width="8" height="1.5" rx=".75"/><rect x="8" y="12" width="8" height="1.5" rx=".75"/><rect x="8" y="15" width="5" height="1.5" rx=".75"/></g></svg></span>
        <span class="nav-label">Personal Agreement</span>
      </button>

      <div class="nav-divider"></div>

      <button class="nav-item" data-route="structure-page" data-tip="ตั้งค่าโครงสร้างวิชา">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><rect opacity=".55" x="3" y="6.5" width="18" height="3" rx="1.5"/><rect opacity=".55" x="3" y="14.5" width="18" height="3" rx="1.5"/><circle cx="9" cy="8" r="3.2"/><circle cx="15.5" cy="16" r="3.2"/></g></svg></span>
        <span class="nav-label">ตั้งค่าโครงสร้างวิชา</span>
      </button>
      <button class="nav-item" data-route="archive-page" data-tip="คลังรายวิชา">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><rect x="2.5" y="3.5" width="19" height="5.5" rx="2"/><path opacity=".55" d="M4 10h16v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18Z"/><rect x="9.5" y="12.5" width="5" height="2.2" rx="1.1"/></g></svg></span>
        <span class="nav-label">คลังรายวิชา</span>
      </button>

      <div class="nav-divider"></div>

      <button class="nav-item" data-route="tools" data-tip="เครื่องมือ">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><path d="M14.7 6.3a4 4 0 0 0-5.4 5L3.5 17.1a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4 4 0 0 0 5-5.4l-2.5 2.5-2.3-.6-.6-2.3Z"/></g></svg></span>
        <span class="nav-label">เครื่องมือ</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="user-chip" data-route="profile" data-tip="ข้อมูลส่วนตัว" aria-label="ข้อมูลส่วนตัว">
        <img id="user-photo" src="" alt="">
        <span class="user-chip-text">
          <span class="name" id="user-name"></span>
          <span class="email" id="user-email"></span>
        </span>
      </button>
      <button class="nav-item" data-route="settings" data-tip="ตั้งค่า">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><path fill-rule="evenodd" d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L14.9 3h-3.8l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.9 7.9 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.7 1l.4 2.6h3.8l.4-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></g></svg></span>
        <span class="nav-label">ตั้งค่า</span>
      </button>
      <button class="nav-item" id="logout-btn" data-tip="ออกจากระบบ">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" stroke="none"><path opacity=".55" d="M9.5 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h3.5Z"/><path d="M15.3 7.3a1 1 0 0 1 1.4 0l4 4a1 1 0 0 1 0 1.4l-4 4a1 1 0 0 1-1.4-1.4l2.3-2.3H10a1 1 0 1 1 0-2h7.6l-2.3-2.3a1 1 0 0 1 0-1.4Z"/></g></svg></span>
        <span class="nav-label">ออกจากระบบ</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div id="view"></div>
  </main>
</div>

<div id="modal-root"></div>
<!-- Dynamic Island: แคปซูลดำกลางบนจอ — พัก = วัน·เวลา | ไอคอน ชื่อหน้าที่เปิดอยู่ (แสดงตลอด เปลี่ยนหน้าแล้วสลับลื่นๆ) / ใช้งาน = แจ้งเตือน บันทึกอัตโนมัติ เลิกทำ ความคืบหน้า (ความสูงคงที่ ยาวขึ้นเฉพาะแนวนอน · ควบคุมโดย js/island.js) -->
<div id="island" class="island" role="status" aria-live="polite" aria-atomic="true">
  <div class="island-idle" aria-hidden="true">
    <span class="island-idle-main">
      <span class="island-idle-date"></span><span class="island-idle-sep">·</span><span class="island-idle-time"></span>
      <span class="island-idle-off"><i></i>ออฟไลน์</span>
    </span>
    <span class="island-idle-page"><span class="pg"></span><span class="pg"></span></span>
  </div>
  <div class="island-body">
    <span class="island-icon" aria-hidden="true"></span>
    <span class="island-text"></span>
    <button type="button" class="island-action" hidden></button>
  </div>
  <div class="island-bar" aria-hidden="true"><i></i></div>
</div>

<!-- Firebase SDK (compat, ง่ายต่อการใช้กับ HTML/JS ธรรมดา) -->
<script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script defer src="js/firebase-config.js"></script>
<script defer src="js/island.js"></script>
<script defer src="js/nav-history.js"></script>
<script defer src="js/utils.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/dashboard.js"></script>
<script defer src="js/courses.js"></script>
<script defer src="js/students.js"></script>
<script defer src="js/structure.js"></script>
<script defer src="js/scores.js"></script>
<script defer src="js/picker-pages.js"></script>
<script defer src="js/report-page.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/pwa.js"></script>
</body>
</html>
