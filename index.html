<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScore — ระบบบันทึกคะแนนสำหรับครู</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="mark-lg">MS</div>
    <h1>MyScore</h1>
    <p>ระบบบันทึกคะแนนสำหรับครู เข้าสู่ระบบด้วยบัญชี Google เพื่อเริ่มใช้งาน</p>
    <button class="google-btn" id="google-signin-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 013.68 9c0-.59.1-1.17.28-1.71V4.95H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.05l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
      เข้าสู่ระบบด้วย Google
    </button>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" class="hidden">
  <button class="hamburger-btn" id="hamburger-btn" aria-label="เปิดเมนู">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-overlay" id="nav-overlay"></div>

  <aside class="sidebar">
    <div class="brand"><span class="mark">MS</span> MyScore</div>
    <button class="nav-item active" data-route="dashboard">🏠 หน้าหลัก</button>
    <button class="nav-item" data-route="courses">📚 รายวิชาของฉัน</button>
    <div class="nav-divider"></div>
    <button class="nav-item" data-route="structure-page">🧮 ตั้งค่าโครงสร้างวิชา</button>
    <button class="nav-item" data-route="scores-page">📝 บันทึกคะแนน</button>
    <div class="nav-divider"></div>
    <button class="nav-item" data-route="settings">⚙️ ตั้งค่า</button>
    <button class="nav-item" id="logout-btn">🚪 ออกจากระบบ</button>
    <div class="sidebar-footer">
      <div class="user-chip">
        <img id="user-photo" src="" alt="">
        <div>
          <div class="name" id="user-name"></div>
          <div class="email" id="user-email"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div id="view"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<!-- Firebase SDK (compat, ง่ายต่อการใช้กับ HTML/JS ธรรมดา) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/courses.js"></script>
<script src="js/students.js"></script>
<script src="js/structure.js"></script>
<script src="js/scores.js"></script>
<script src="js/report.js"></script>
<script src="js/picker-pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
