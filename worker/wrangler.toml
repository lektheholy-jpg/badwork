name = "badwork-gemini-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "mywork-lektheholy"
# แก้เป็นโดเมนจริงของเว็บ (คั่นด้วย ,) — ตัด localhost ออกตอนใช้งานจริงได้
ALLOWED_ORIGINS = "https://lektheholy-jpg.github.io,https://wenkham.pages.dev"
# GEMINI_API_KEY ตั้งด้วยคำสั่ง: npx wrangler secret put GEMINI_API_KEY

# ---- คุมค่าใช้จ่าย Gemini (ไม่บังคับ · เอา # ออกเพื่อเปิดใช้) ----
# จำกัดโดเมนอีเมล: ใส่โดเมนโรงเรียนจริง (คั่นด้วย ,) — ผู้ใช้ Gmail ส่วนตัวจะใช้ AI ไม่ได้
# ALLOWED_EMAIL_DOMAINS = "school.ac.th"
# โควตารายวัน (ตามเวลาไทย) — ต้องสร้าง KV ด้านล่างด้วยจึงจะทำงาน
# DAILY_LIMIT_PER_USER = "150"   # คำขอ/คน/วัน
# DAILY_LIMIT_GLOBAL = "3000"    # คำขอรวมทุกคน/วัน = เพดานค่าใช้จ่ายสูงสุดต่อวัน

# จำกัดคำขอต่อผู้ใช้: 20 ครั้ง / 60 วินาที (period รับเฉพาะ 10 หรือ 60) · ปรับ limit ตามการใช้จริง
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# KV สำหรับโควตารายวัน: สร้างด้วย  npx wrangler kv namespace create QUOTA  แล้วใส่ id ที่ได้ และเอา # ออก
# [[kv_namespaces]]
# binding = "QUOTA"
# id = "ใส่ id ที่ได้จากคำสั่งด้านบน"

# ---- แจ้งเตือนก่อนเริ่มคาบสอน (Web Push · ไม่บังคับ) ----
# 1) สร้างคีย์:  node tools/gen-vapid.js   → ได้ public/private key
# 2) KV เก็บ subscription:  npx wrangler kv namespace create PUSH   แล้วใส่ id ที่ได้ และเอา # ออก
# 3) ตั้ง secret:  npx wrangler secret put VAPID_PRIVATE_KEY   (วาง private key)
# 4) ใส่ public key ด้านล่าง + ที่ TT_PUSH.vapidKey ใน js/timetable.js   แล้ว  npx wrangler deploy
# [vars] ด้านบนมีอยู่แล้ว — ใส่สองบรรทัดนี้ไว้ใต้ [vars] (TOML ห้ามประกาศ [vars] ซ้ำ):
VAPID_PUBLIC_KEY = "BMcslZVJ7pSQJlxfMvw5-QK7AIjXP14fv7ebtcnmcgC22dwsVO31p0wau026_rVcOq7dJE2eNfEkM89s-9fF-QU"
VAPID_SUBJECT = "mailto:lektheholy@gmail.com"
[[kv_namespaces]]
binding = "PUSH"
id = "2f85b6b57793447a800b7fb03c58f108"

# cron เป็นเวลา UTC: 00:00–10:59 UTC = 07:00–17:59 น. เวลาไทย · วันจันทร์–ศุกร์ · ทุกนาที
# (KV แผนฟรี list ได้ 1,000 ครั้ง/วัน — ช่วงเวลานี้ใช้ ~660 ครั้ง/วัน จึงไม่ควรขยายช่วงเวลาถ้าอยู่แผนฟรี)
[triggers]
# crons = ["* 0-10 * * 1-5"]
